<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../engine/base.css"></head><body>
<div id="cam">
  <div class="abs mask body" id="a1" style="top:720px;font-size:72px"><span>Günde sadece</span></div>
  <div class="abs h1 ember" id="a2" style="top:830px;font-size:200px;letter-spacing:-8px">10 SAYFA</div>
  <div class="abs mask h2" id="a3" style="top:1090px;font-size:100px"><span>Kaç kitap eder?</span></div>
</div>
<div id="screen">
  <div class="abs mask body" id="b1" style="top:250px;font-size:62px"><span>1 yıl boyunca</span></div>
  <div class="abs kick" id="b2" style="top:360px">SAYFA</div>
  <div class="abs h1 ember" id="b3" style="top:400px;font-size:150px;letter-spacing:-5px">0</div>
  <div class="abs h2" id="b4" style="top:560px;font-size:64px;letter-spacing:4px">0 KİTAP</div>
  <div class="abs mask body" id="b5" style="top:1745px;font-size:46px"><span>12 kitap. <span style="color:#ffae6b">12 farklı akıl.</span></span></div>
  <div class="abs dim" id="b6" style="top:1830px;font-size:24px;font-weight:500">300 sayfalık kitaplarla hesaplandı</div>

  <div class="abs mask body" id="c1" style="top:560px;left:90px;width:700px;text-align:left;font-size:70px"><span>10 yılda</span></div>
  <div class="abs h1 ember" id="c2" style="top:650px;left:84px;width:720px;text-align:left;font-size:190px;letter-spacing:-8px">120</div>
  <div class="abs h2" id="c3" style="top:830px;left:90px;width:700px;text-align:left;font-size:96px;letter-spacing:2px">KİTAP</div>
  <div class="abs mask body dim" id="c4" style="top:980px;left:90px;width:700px;text-align:left;font-size:46px"><span>Bir kütüphane rafı dolusu.</span></div>

  <div class="abs mask body" id="d1" style="top:740px;font-size:70px"><span>Okuduğun her sayfa</span></div>
  <div class="abs mask h2" id="d2" style="top:840px;font-size:110px"><span>seni dünkü</span></div>
  <div class="abs mask h1" id="d3" style="top:980px;font-size:126px;letter-spacing:-4px"><span class="ember">halinden ayırır.</span></div>

  <div class="abs mask h2" id="e1" style="top:740px;font-size:108px"><span>Bugünkü 10 sayfan</span></div>
  <div class="abs mask h1" id="e2" style="top:880px;font-size:130px;letter-spacing:-4px"><span class="ember">hangi kitaptan?</span></div>
  <div class="abs" id="e3" style="top:1170px;--pill:rgba(255,138,61,.7);--pillc:#ffc394"><span class="pill">YORUMA KİTABINI YAZ</span></div>
</div>
<script src="../../engine/engine.js"></script>
<script>
let A2,C2;const BOOKS=[];
const PAL=['#7a1e2c','#1d3557','#2d5a3d','#c9962b','#e8dcc4','#1f6f78','#5a1e3a','#3a3a44','#a8432a','#41316b','#d4c3a1','#24414f'];
boot({dur:21,leaks:['255,120,50','255,80,120'],
  init(){A2=split('a2');C2=split('c2');const R=rnd(21);let y=1700;
    for(let i=0;i<120;i++){const h=58+R()*34,w=470+R()*170;y-=h;
      BOOKS.push({h,w,dx:(R()-.5)*60,rot:(R()-.5)*.05,col:PAL[(i*7+Math.floor(R()*3))%PAL.length],y,
        s:i<12?4.0+i*.42:10.9+(i-12)*.0157,d:i<12?.45:.3,band:R()})}},
  bokeh:t=>'255,150,80',
  shakes:[[.65,22],[12.4,26]],
  flashes:[[.65,.3],[12.4,.35]],
  sparks:[[.65,540,940,.45,'ember'],[9.1,540,BOOKS.length?BOOKS[11].y:900,.4,'ember'],[12.4,330,720,.7,'ember']],

  scene(t){
    maskLine('a1',t,.1,2.9);slam(A2,t,.4,{st:.05,dur:.45,out:2.9});sweep(A2,L(100,0,k(t,.6,2.8,E.ioC)));
    maskLine('a3',t,.95,3.0);
    // kitaplar
    const g=ENG.fx;const z=k(t,10.6,13.0,E.ioC),zo=k(t,14.3,14.7,E.iC);
    const cs_=L(1,.19,z)*(1+.02*Math.sin(t*.5)),cfx=L(540,-934,z),cfy=L(960,-2800,z);
    g.save();g.translate(540,960);g.scale(cs_,cs_);g.translate(-cfx,-cfy);g.globalAlpha=1-zo;
    if(t>3.8&&t<14.7){BOOKS.forEach((b,i)=>{if(t<b.s)return;const p=P(t,b.s,b.s+b.d);
      const y0=b.y-(i<12?1500:2600);let y=p<1?L(y0,b.y,p*p):b.y-10*pulse(t,b.s+b.d,9)*Math.cos((t-b.s-b.d)*30);
      const rot=b.rot+(p<1?(1-p)*.25*(i%2?1:-1):0);
      g.save();g.translate(540+b.dx,y+b.h/2);g.rotate(rot);
      if(i<12||cs_>.5){g.shadowColor='rgba(0,0,0,.6)';g.shadowBlur=24;g.shadowOffsetY=8;}
      const gr=g.createLinearGradient(0,-b.h/2,0,b.h/2);gr.addColorStop(0,'rgba(255,255,255,.18)');gr.addColorStop(.35,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(0,0,0,.35)');
      rr(g,-b.w/2,-b.h/2,b.w,b.h,8);g.fillStyle=b.col;g.fill();g.shadowColor='transparent';g.fillStyle=gr;g.fill();
      g.strokeStyle='rgba(255,215,150,.55)';g.lineWidth=3;[-b.w/2+36,b.w/2-36].forEach(x=>{g.beginPath();g.moveTo(x,-b.h/2+8);g.lineTo(x,b.h/2-8);g.stroke()});
      g.fillStyle='rgba(255,240,215,.22)';rr(g,-60-b.band*40,-b.h*.18,120+b.band*80,b.h*.36,4);g.fill();
      // iniş parıltısı
      const gl=pulse(t,b.s+b.d,6)*(i<12?1:.4);if(gl>0.01){g.globalCompositeOperation='lighter';g.fillStyle=`rgba(255,160,80,${.35*gl})`;rr(g,-b.w/2,-b.h/2,b.w,b.h,8);g.fill()}
      g.restore()})}
    g.restore();
    // S2 sayaçlar
    const o2=k(t,10.3,10.7,E.iC);
    maskLine('b1',t,3.4,10.3);fadeBlock('b2',t,3.7,10.3,{dy:20});
    const landed=BOOKS.slice(0,12).filter(b=>t>=b.s+b.d).length;
    $('b3').textContent=fmt(3650*k(t,4.0,9.1,E.lin));$('b4').textContent=landed+' KİTAP';
    set('b3',{o:k(t,3.8,4.2)*(1-o2),s:1+.12*pulse(t,9.1,6),b:o2*14});
    set('b4',{o:k(t,4.3,4.7)*(1-o2),s:1+.1*(landed>0?pulse(t,BOOKS[landed-1].s+BOOKS[landed-1].d,10):0),b:o2*14});
    $('b4').style.color=landed>=12?'#ffae6b':'#f4f2ee';
    maskLine('b5',t,9.3,10.35);fadeBlock('b6',t,9.6,10.35,{dy:10});
    // S3
    maskLine('c1',t,11.6,14.3);slam(C2,t,12.4,{st:.06,dur:.5,from:'left',out:14.3});sweep(C2,L(100,0,k(t,12.6,14.2,E.ioC)));
    const cv=Math.round(L(12,120,k(t,11.0,12.4,E.oC)));const cs=String(cv);C2.forEach((c,i)=>c.textContent=cs[i]||'');
    fadeBlock('c3',t,12.6,14.3,{dy:30});maskLine('c4',t,13.1,14.35);
    // S4
    maskLine('d1',t,14.7,17.5);maskLine('d2',t,15.0,17.55);maskLine('d3',t,15.4,17.6);
    $('d3').firstElementChild.style.backgroundPosition=`${L(140,-40,k(t,15.6,17.4,E.ioC))}% 0`;
    // S5
    maskLine('e1',t,17.7,20.45);maskLine('e2',t,18.0,20.5);
    $('e2').firstElementChild.style.backgroundPosition=`${L(140,-40,k(t,18.2,20.2,E.ioC))}% 0`;
    fadeBlock('e3',t,18.7,20.5,{dy:40});$('e3').style.transform+=` scale(${1+.03*Math.sin(t*5)*(t>19.2?1:0)})`;
  }});
</script></body></html>
